[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "dot-listener"
version = "0.1.0"
description = "Local-first voice input architecture for an existing dot assistant"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.5", "cryptography==46.0.4"]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]
browser = ["playwright==1.57.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
